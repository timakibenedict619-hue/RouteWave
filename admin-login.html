<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RouteWave • Admin Sign In</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>

<div class="login-page">

  <section class="login-hero">
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-truck-fast"></i></div>
      <div>
        <div class="brand-name">RouteWave</div>
        <div class="brand-sub">Admin console</div>
      </div>
    </div>

    <div>
      <h2>Manage shipments, customers, and funds.</h2>
      <p>Restricted to RouteWave administrators. Sign in with your admin email and password.</p>
    </div>

    <div class="foot">© 2026 RouteWave. Authorised personnel only.</div>
  </section>

  <section class="login-panel">
    <div class="login-box">

      <h1>Admin sign in</h1>
      <p class="sub">Enter your admin credentials to continue.</p>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@routewave.com" autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button id="loginBtn" class="btn btn-block" style="margin-top:6px">Sign in</button>

      <p id="error" class="msg err" style="text-align:center"></p>

      <div class="alt">Are you a customer? <a href="customer-login.html">Customer sign in</a></div>

    </div>
  </section>

</div>

<script type="module" src="admin-login.js"></script>

</body>
</html>
