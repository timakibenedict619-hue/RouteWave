<!DOCTYPE html>
<html lang="en" class="gate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RouteWave • Change Password</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="ui.css">
<style>
  @media (max-width: 860px){
    .app{ flex-direction:column; }
    .sidebar{ width:auto; position:static; }
    .main{ margin-left:0; padding:22px 16px 40px; }
  }
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-truck-fast"></i></div>
      <div>
        <div class="brand-name">RouteWave</div>
        <div class="brand-sub">Customer portal</div>
      </div>
    </div>

    <div>
      <div class="nav-label">My account</div>
      <nav class="nav">
        <a href="my-dashboard.html"><i class="fa-solid fa-gauge-high"></i>My dashboard</a>
        <a href="change-password.html" class="active"><i class="fa-solid fa-key"></i>Change password</a>
        <a href="support.html"><i class="fa-solid fa-comments"></i>Support chat<span class="chat-badge" id="customerChatBadge" hidden>0</span></a>
      </nav>
    </div>

    <div>
      <div class="nav-label">Tools</div>
      <nav class="nav">
        <a href="tracking.html"><i class="fa-solid fa-location-dot"></i>Track a shipment</a>
      </nav>
    </div>

    <div class="sidebar-foot">
      <div style="color:#64748B;margin-bottom:4px">Signed in as</div>
      <div class="who" id="userEmail">-</div>
      <button id="logoutBtn" class="btn btn-ghost btn-block" style="margin-top:12px;background:transparent;color:#fff;border-color:rgba(255,255,255,.25)">
        <i class="fa-solid fa-right-from-bracket"></i>Logout
      </button>
    </div>
  </aside>

  <main class="main">

    <div class="page-head">
      <div>
        <h1>Change password</h1>
        <p>Enter your current password, then choose a new one.</p>
      </div>
    </div>

    <div class="card" style="max-width:640px">
      <div class="shipment-head" style="margin-bottom:14px">
        <div>
          <h2>Update your password</h2>
          <p class="card-sub" style="margin:0">Your new password must be at least 6 characters.</p>
        </div>
        <i class="fa-solid fa-shield-halved" style="color:var(--brand-1);font-size:22px"></i>
      </div>

      <form id="passwordForm">
        <div class="form-grid">
          <div class="field span-2">
            <label for="pwCurrent">Current password</label>
            <input type="password" id="pwCurrent" autocomplete="current-password" required>
          </div>
          <div class="field">
            <label for="pwNew">New password</label>
            <input type="password" id="pwNew" minlength="6" autocomplete="new-password" required>
          </div>
          <div class="field">
            <label for="pwConfirm">Confirm new password</label>
            <input type="password" id="pwConfirm" minlength="6" autocomplete="new-password" required>
          </div>
        </div>
        <button type="submit" class="btn" style="width:auto"><i class="fa-solid fa-key"></i>Update password</button>
        <p id="passwordMsg" class="msg"></p>
      </form>
    </div>

  </main>

</div>

<script type="module" src="change-password.js"></script>

<script type="module" src="maintenance.js"></script>
<script type="module" src="chat-badge.js"></script>
</body>
</html>
