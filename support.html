<!DOCTYPE html>
<html lang="en" class="gate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RouteWave • Support Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="ui.css">
<style>
  @media (max-width: 860px){
    .app{ flex-direction:column; }
    .sidebar{ width:auto; position:static; }
    .main{ margin-left:0; padding:22px 16px 40px; }
  }
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-truck-fast"></i></div>
      <div>
        <div class="brand-name">RouteWave</div>
        <div class="brand-sub">Customer portal</div>
      </div>
    </div>

    <div>
      <div class="nav-label">My account</div>
      <nav class="nav">
        <a href="my-dashboard.html"><i class="fa-solid fa-gauge-high"></i>My dashboard</a>
        <a href="change-password.html"><i class="fa-solid fa-key"></i>Change password</a>
        <a href="support.html" class="active"><i class="fa-solid fa-comments"></i>Support chat<span class="chat-badge" id="customerChatBadge" hidden>0</span></a>
      </nav>
    </div>

    <div>
      <div class="nav-label">Tools</div>
      <nav class="nav">
        <a href="tracking.html"><i class="fa-solid fa-location-dot"></i>Track a shipment</a>
      </nav>
    </div>

    <div class="sidebar-foot">
      <div style="color:#64748B;margin-bottom:4px">Signed in as</div>
      <div class="who" id="userEmail">-</div>
      <button id="logoutBtn" class="btn btn-ghost btn-block" style="margin-top:12px;background:transparent;color:#fff;border-color:rgba(255,255,255,.25)">
        <i class="fa-solid fa-right-from-bracket"></i>Logout
      </button>
    </div>
  </aside>

  <main class="main">

    <div class="page-head">
      <div>
        <h1>Support chat</h1>
        <p>Ask about your shipments or account. Our team replies here.</p>
      </div>
    </div>

    <section class="wa-shell wa-solo">

      <header class="wa-head">
        <div class="wa-avatar support"><i class="fa-solid fa-headset"></i></div>
        <div class="wa-head-text">
          <div class="wa-title">RouteWave Support</div>
          <div id="chatStatus" class="wa-status">Support team</div>
        </div>
      </header>

      <div class="wa-lock"><i class="fa-solid fa-lock"></i><span id="lockText">Securing this chat...</span></div>

      <div id="chatBody" class="wa-body">
        <p class="wa-empty">Loading...</p>
      </div>

      <form id="chatForm" class="wa-form">
        <label class="wa-icon-btn" title="Attach a photo or document"><i class="fa-solid fa-paperclip"></i><input id="chatFile" type="file" hidden accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.zip"></label>
        <input id="chatInput" type="text" maxlength="1000" placeholder="Type a message" autocomplete="off">
        <button id="sendBtn" class="wa-send" type="submit" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
      <p id="chatMsg" class="wa-msg"></p>

    </section>

  </main>

</div>

<script type="module" src="support.js"></script>
<script type="module" src="chat-badge.js"></script>
<script type="module" src="maintenance.js"></script>
<script type="module" src="presence.js" data-role="customer"></script>

</body>
</html>
