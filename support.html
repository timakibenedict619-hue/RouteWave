<!DOCTYPE html>
<html lang="en" class="gate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RouteWave • Support Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="ui.css">
<style>
  @media (max-width: 860px){
    .app{ flex-direction:column; }
    .sidebar{ width:auto; position:static; }
    .main{ margin-left:0; padding:22px 16px 40px; }
  }
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-truck-fast"></i></div>
      <div>
        <div class="brand-name">RouteWave</div>
        <div class="brand-sub">Customer portal</div>
      </div>
    </div>

    <div>
      <div class="nav-label">My account</div>
      <nav class="nav">
        <a href="my-dashboard.html"><i class="fa-solid fa-gauge-high"></i>My dashboard</a>
        <a href="change-password.html"><i class="fa-solid fa-key"></i>Change password</a>
        <a href="support.html" class="active"><i class="fa-solid fa-comments"></i>Support chat<span class="chat-badge" id="customerChatBadge" hidden>0</span></a>
      </nav>
    </div>

    <div>
      <div class="nav-label">Tools</div>
      <nav class="nav">
        <a href="tracking.html"><i class="fa-solid fa-location-dot"></i>Track a shipment</a>
      </nav>
    </div>

    <div class="sidebar-foot">
      <div style="color:#64748B;margin-bottom:4px">Signed in as</div>
      <div class="who" id="userEmail">-</div>
      <button id="logoutBtn" class="btn btn-ghost btn-block" style="margin-top:12px;background:transparent;color:#fff;border-color:rgba(255,255,255,.25)">
        <i class="fa-solid fa-right-from-bracket"></i>Logout
      </button>
    </div>
  </aside>

  <main class="main">

    <div class="page-head">
      <div>
        <h1>Support chat</h1>
        <p>Ask about your shipments or account. Our team replies here.</p>
      </div>
    </div>

    <section class="card chat-pane" style="max-width:880px;min-height:560px">
      <div class="chat-head" style="display:flex;align-items:center;gap:14px">
        <div style="width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--brand-1),#0E7490);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px">
          <i class="fa-solid fa-headset"></i>
        </div>
        <div>
          <div class="id">RouteWave Support</div>
          <div class="muted" style="font-size:13px">We reply here as soon as possible</div>
        </div>
      </div>

      <div id="chatBody" class="chat-body">
        <p class="empty">Loading...</p>
      </div>

      <form id="chatForm" class="chat-form">
        <label class="btn btn-ghost attach-btn" title="Attach a photo or document"><i class="fa-solid fa-paperclip"></i><input id="chatFile" type="file" hidden accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.zip"></label>
        <input id="chatInput" type="text" maxlength="1000" placeholder="Type your question..." autocomplete="off">
        <button class="btn" type="submit"><i class="fa-solid fa-paper-plane"></i>Send</button>
      </form>
      <p id="chatMsg" class="msg" style="padding:0 22px 16px;margin:0"></p>
    </section>

  </main>

</div>

<script type="module" src="support.js"></script>
<script type="module" src="chat-badge.js"></script>
<script type="module" src="maintenance.js"></script>

</body>
</html>
