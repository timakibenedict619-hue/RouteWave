<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RouteWave • Track Shipment</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>

<header class="site-top">
  <a href="index.html" class="brand">
    <div class="brand-mark"><i class="fa-solid fa-truck-fast"></i></div>
    <div>
      <div class="brand-name">RouteWave</div>
      <div class="muted">Global logistics</div>
    </div>
  </a>
  <div class="head-actions">
    <a class="btn btn-ghost" href="customer-login.html" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.25)">
      <i class="fa-solid fa-user"></i>Customer login
    </a>
  </div>
</header>

<section class="track-hero">
  <h1>Track your shipment</h1>
  <p>Enter your tracking ID to see the latest status, location, and updates.</p>

  <div class="track-search">
    <input type="text" id="trackingInput" placeholder="e.g. TRK1730000000000123456" autocomplete="off">
    <button id="trackBtn" class="btn"><i class="fa-solid fa-magnifying-glass"></i>Track</button>
  </div>
</section>

<main class="track-body">

  <div id="notFound" class="card" style="display:none;text-align:center;margin-bottom:20px"></div>

  <div id="resultCard" class="card" style="display:none">

    <div class="shipment-head" style="margin-bottom:18px">
      <div>
        <div class="muted" style="font-size:13px">Tracking ID</div>
        <div class="id" id="trackingId" style="font-size:20px">-</div>
      </div>
      <span class="badge" id="status">-</span>
    </div>

    <div class="progress"><span id="progressFill"></span></div>
    <div class="route" style="margin:14px 0 22px">
      <span id="origin">-</span><i class="fa-solid fa-arrow-right"></i><span id="destination">-</span>
    </div>

    <div class="info-grid" style="margin-bottom:22px">
      <div class="info-item"><label>Current location</label><span id="currentLocation">-</span></div>
      <div class="info-item"><label>Expected delivery</label><span id="expectedDelivery">-</span></div>
      <div class="info-item"><label>Carrier</label><span id="carrier">-</span></div>
      <div class="info-item"><label>Weight</label><span id="weight">-</span></div>
    </div>

    <div class="section-divider"></div>

    <h2 style="margin-bottom:14px">History</h2>
    <ul class="timeline" id="timeline">
      <li>No tracking history available.</li>
    </ul>

  </div>

</main>

<script type="module" src="tracking.js"></script>

<script type="module" src="maintenance.js"></script>
</body>
</html>
